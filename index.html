<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PanelVerse</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #0b0b12;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 500px;
            text-align: center;
        }

        .logo {
            width: 110px;
            height: 110px;
            margin: 0 auto 25px;
            border-radius: 30px;
            background: linear-gradient(135deg, #6c5ce7, #00cec9);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
            font-weight: bold;
        }

        h1 {
            font-size: 38px;
            margin: 0 0 10px;
        }

        p {
            color: #aaa;
            font-size: 16px;
            margin-bottom: 30px;
        }

        .button {
            display: block;
            width: 100%;
            padding: 16px;
            margin: 12px 0;
            border-radius: 14px;
            background: #ffffff;
            color: #111;
            text-decoration: none;
            font-size: 17px;
            font-weight: bold;
            transition: 0.2s;
        }

        .button:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }

        .footer {
            margin-top: 35px;
            color: #666;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="logo">
            PV
        </div>

        <h1>PanelVerse</h1>

        <p>
            Your home for Manga, Comics and more.
        </p>

        <a class="button" href="https://t.me/YOUR_CHANNEL">
            Manga
        </a>

        <a class="button" href="https://t.me/YOUR_DC_CHANNEL">
            DC
        </a>

        <a class="button" href="https://t.me/YOUR_MARVEL_CHANNEL">
            Marvel
        </a>

        <div class="footer">
            © 2026 PanelVerse
        </div>

    </div>

</body>
</html>
